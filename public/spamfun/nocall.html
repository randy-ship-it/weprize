<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Never-call list | WePrize Spam Fun</title>
<meta name="description" content="Add your number and you'll never get a WePrize joke text or call.">
<meta name="theme-color" content="#FF4A1C">
<link rel="icon" href="/favicon.svg">
<style>
:root{--bg:#FAF7F2;--ink:#14110F;--mute:#6B645C;--line:#E7E0D6;--acc:#FF4A1C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:0 20px}nav{padding:20px 0}.logo{font-weight:800;font-size:19px;text-decoration:none;color:inherit}.logo span{color:var(--acc)}
h1{font-size:clamp(32px,6vw,48px);line-height:1.05;letter-spacing:-.03em;margin:10px 0 12px}p{color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px}
input{font:inherit;font-size:18px;width:100%;padding:14px 16px;border:2px solid var(--line);border-radius:12px;margin:0 0 12px}input:focus{outline:0;border-color:var(--ink)}
.btn{border:0;border-radius:999px;padding:15px 26px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;width:100%}
.msg{font-weight:700;min-height:1.2em;margin:12px 0 0;color:var(--ink)}.hp{position:absolute;left:-9999px}
</style>
</head>
<body><div class="wrap">
<nav><a class="logo" href="/spamfun">Spam <span>Fun</span></a></nav>
<h1>Never-call list</h1>
<p>Add your number and you'll never get a WePrize joke text or call. No questions asked. You can also reply STOP to any of our texts.</p>
<form class="card" id="f" novalidate>
  <label for="phone"><b>Your phone number</b></label>
  <input type="tel" id="phone" inputmode="tel" placeholder="416 555 0123" autocomplete="tel">
  <input class="hp" id="company" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button class="btn" type="submit" id="go">Never contact this number</button>
  <p class="msg" id="msg" role="status"></p>
</form>
<p style="font-size:14px;margin-top:24px">Spam Fun is a WePrize community project. We're the opposite of spam.</p>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault(); const m = document.getElementById('msg'), b = document.getElementById('go'); b.disabled = true; m.textContent = '';
  const r = await fetch('/api/fsc/prank/block', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ phone: document.getElementById('phone').value, company: document.getElementById('company').value }) }).catch(() => null);
  const j = r ? await r.json().catch(() => ({})) : {}; b.disabled = false;
  m.textContent = r && r.ok ? "Done. That number will never get a WePrize joke text or call." : (j.error || 'Please try again.');
});
</script>
</body></html>
